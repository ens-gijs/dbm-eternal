plugins {
    id 'java-library'
    // https://vanniktech.github.io/gradle-maven-publish-plugin/central/
    id 'com.vanniktech.maven.publish' version '0.30.0' apply false
}

allprojects {
    group = 'io.github.ensgijs.dbm'
    version = '1.0.0-SNAPSHOT'

    repositories {
        mavenCentral()
        maven { url = 'https://repo.papermc.io/repository/maven-public/' }
    }
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'com.vanniktech.maven.publish'

    java {
        toolchain.languageVersion = JavaLanguageVersion.of(21)
    }

    javadoc {
        options {
            // Syntax: 'tag_name:placement:header_text'
            // 'a' means the tag can be used in all places
            tags(
                    'apiNote:a:API Note:',
                    'implSpec:a:Implementation Requirements:',
                    'implNote:a:Implementation Note:'
            )
            // Don't fail the build on javadoc lint warnings — only on actual errors.
            addStringOption('Xdoclint:none', '-quiet')
        }
    }

    // Maven Central publishing — handled by the vanniktech plugin.
    // It auto-creates sources + javadoc jars, signs all artifacts, and uploads
    // to the Sonatype Central Portal. Credentials & signing keys are read from
    // gradle properties / env vars (see gradle.properties.example).
    mavenPublishing {
        publishToMavenCentral(com.vanniktech.maven.publish.SonatypeHost.CENTRAL_PORTAL, true)
        signAllPublications()

        coordinates(project.group.toString(), project.name, project.version.toString())

        pom {
            name = project.name
            description = 'A platform-agnostic Database & Repository Manager'
            url = 'https://github.com/ens-gijs/dbm-eternal'
            inceptionYear = '2026'

            licenses {
                license {
                    name = 'The Apache License, Version 2.0'
                    url = 'https://www.apache.org/licenses/LICENSE-2.0.txt'
                    distribution = 'repo'
                }
            }
            developers {
                developer {
                    id = 'ens-gijs'
                    name = 'Ens Gijs (Ross)'
                    url = 'https://github.com/ens-gijs'
                }
            }
            scm {
                connection = 'scm:git:https://github.com/ens-gijs/dbm-eternal.git'
                developerConnection = 'scm:git:ssh://git@github.com/ens-gijs/dbm-eternal.git'
                url = 'https://github.com/ens-gijs/dbm-eternal'
            }
            issueManagement {
                system = 'GitHub'
                url = 'https://github.com/ens-gijs/dbm-eternal/issues'
            }
        }
    }
}
